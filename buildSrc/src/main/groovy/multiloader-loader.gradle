plugins {
    id 'multiloader-common'
    id 'com.gradleup.shadow'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
    shadeRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    shadeRuntime("org.spongepowered:configurate-hocon:4.1.2")
    shadeRuntime("org.spongepowered:configurate-core:4.1.2")
    shadeRuntime("com.typesafe:config:1.4.2")
    shadeRuntime("io.leangen.geantyref:geantyref:1.3.14")
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shadeRuntime]
    relocate("org.spongepowered.configurate", "com.epherical.epherolib.libs.org.spongepowered.configurate")
    relocate("com.typesafe", "com.epherical.epherolib.libs.com.typesafe")
    relocate("io.leangen", "com.epherical.epherolib.libs.io.leangen")
}
