plugins {
    id 'multiloader-common'
    id 'com.gradleup.shadow'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
    shadeRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}
configurations.named('runtimeClasspath') {
    extendsFrom(configurations.shadeRuntime)
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    shadeRuntime("io.javalin:javalin:7.2.3") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.ow2.asm"
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(project(':common').tasks.named('buildEditorUi'))
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava.asFileTree.matching { include '**/*.java' })
}

tasks.named('sourcesJar', Jar) {
    dependsOn(project(':common').tasks.named('buildEditorUi'))
    dependsOn(configurations.commonJava)
    from(configurations.commonJava) {
        include '**/*.java'
    }
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shadeRuntime]
    relocate("io.javalin", "com.epherical.datapackeditor.libs.io.javalin")
    relocate("org.eclipse.jetty", "com.epherical.datapackeditor.libs.org.eclipse.jetty")
    relocate("jakarta", "com.epherical.datapackeditor.libs.jakarta")
    relocate("kotlin", "com.epherical.datapackeditor.libs.kotlin")
    mergeServiceFiles()
}
