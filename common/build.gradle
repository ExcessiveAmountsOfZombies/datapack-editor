plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow'
    id 'com.github.node-gradle.node'
}

configurations {
    shade
    api.extendsFrom shade
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common.
    // If this needs updating, check the versions bundled by both loaders:
    // https://github.com/neoforged/NeoForge/blob/26.1.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common.
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))

    compileOnly("com.epherical.epherolib:EpheroLib:${epherolib_version}-${epherolib_minecraft_version}") {
        transitive = false
    }
    shade("io.javalin:javalin:7.2.3") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.ow2.asm" // both loaders already provide ASM...
    }
}

def editorUiDirectory = rootProject.file('editor-ui')
def editorAssetsDirectory = file('src/main/resources/datapack-editor/editor')

node {
    download = true
    version = '24.13.0'
    nodeProjectDir = editorUiDirectory
    npmInstallCommand = 'ci'
    fastNpmInstall = true
}

// Only the renderer's browser export is bundled; its native Node renderers need no install scripts.
tasks.named('npmInstall') {
    args = ['--ignore-scripts']
    inputs.property('nodeVersion', node.version)
    inputs.property('npmVersion', node.npmVersion)
    inputs.files(fileTree(editorUiDirectory) { include '.npmrc' }).withPropertyName('npmConfiguration')
}

def buildEditorUi = tasks.register('buildEditorUi', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.files(fileTree(editorUiDirectory) {
        include 'src/**', 'index.html', 'vite.config.ts', 'tsconfig.json', 'package.json', 'package-lock.json'
    })
    outputs.dir(editorAssetsDirectory)
}

tasks.named('processResources') {
    dependsOn buildEditorUi
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

artifacts {
    archives shadowJar
    shadow shadowJar
}

tasks.register('sourceJar', Jar) {
    dependsOn buildEditorUi
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.named('sourcesJar', Jar) {
    dependsOn buildEditorUi
}

shadowJar {
    archiveClassifier = ""
    enabled = true
    configurations = [project.configurations.shade]
    relocate("io.javalin", "com.epherical.datapackeditor.libs.io.javalin")
    relocate("org.eclipse.jetty", "com.epherical.datapackeditor.libs.org.eclipse.jetty")
    relocate("jakarta", "com.epherical.datapackeditor.libs.jakarta")
    relocate("kotlin", "com.epherical.datapackeditor.libs.kotlin")
    mergeServiceFiles()
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
